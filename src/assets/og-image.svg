<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Quaderno OG card: squared paper, pink margin, the favicon mark, the title
       over a highlighter swipe, a red-pen tick and a pencil doodle.
       NOTE: web fonts cannot be used here. librsvg (shipped with sharp) ignores
       @font-face data URLs, so text uses Arial/Helvetica; everything else is
       paths. This SVG is only rasterized once into public/og-image.png with
       sharp; the live site uses Atkinson Hyperlegible Next and Shantell Sans. -->
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#DCE4EC" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#F7F8F4"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <path d="M96 0V630" stroke="#EBA9B1" stroke-width="4"/>

  <!-- Mark (same artwork as public/favicon.svg), scaled 2.7x -->
  <g transform="translate(150 98) scale(2.7)">
    <rect width="64" height="64" rx="12" fill="#F7F8F4" stroke="#1E3A8A" stroke-width="1.2"/>
    <path d="M0 13H64M0 26H64M0 39H64M0 52H64M26 0V64M39 0V64M52 0V64" stroke="#DCE4EC" stroke-width="1"/>
    <path d="M12 0V64" stroke="#EBA9B1" stroke-width="2.5"/>
    <path d="M16.5 37.2C25 35.6 36 36.4 47 35.3S56.6 34.9 58.4 35.6L58.9 48.6C50 49.7 40 48.5 31 49.6S20 50.1 16.2 49.7C15.6 45.6 15.7 41.2 16.5 37.2Z" fill="#F5E663"/>
    <g fill="none" stroke="#1E3A8A" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19.6 48.6C22.3 38.9 25.3 27.4 28.8 15.4C32.1 26.6 35.2 38 38.4 48.8"/>
      <path d="M23.6 37.6C27.2 36.6 30.8 36.5 34.6 36.9"/>
      <path d="M43.4 16.1C46.4 15.4 49.4 15.6 52.6 15.8"/>
      <path d="M48 16C47.6 26.8 48.1 38.2 47.8 48.6"/>
      <path d="M43 48.9C46.3 49.4 49.6 49 52.9 49.3"/>
    </g>
  </g>

  <!-- Highlighter swipe behind the lower part of the title -->
  <path d="M356 214C470 206 640 210 830 204C834 224 835 244 832 262C640 270 470 266 354 272C350 252 351 232 356 214Z" fill="#F5E663" fill-opacity="0.92"/>

  <!-- Title -->
  <text x="360" y="262" font-family="Arial, Helvetica, sans-serif"
        font-size="132" font-weight="700" fill="#1E3A8A" letter-spacing="-3">AI-Guide</text>

  <!-- Tagline -->
  <text x="150" y="440" font-family="Arial, Helvetica, sans-serif"
        font-size="48" font-weight="400" fill="#23272E">Impara a usare l'IA, passo dopo passo.</text>

  <!-- Red pen: a tick -->
  <path d="M960 120L990 160L1058 78" fill="none" stroke="#B3122A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Pencil doodle, same drawing as the Icon set, scaled -->
  <g transform="translate(940 380) scale(9)" fill="none" stroke="#1E3A8A" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 20.2L5 15.5L16.4 4.1C17.5 3 19.3 3 20.4 4.1C21.5 5.2 21.5 7 20.4 8.1L8.8 19.4Z"/>
    <path d="M14.4 6.2L18.3 10"/>
    <path d="M5 15.5L8.7 19.3"/>
  </g>

  <!-- Author line -->
  <text x="150" y="552" font-family="Arial, Helvetica, sans-serif"
        font-size="28" font-weight="700" fill="#5B6470">di Fabrizio La Rosa</text>
  <text x="430" y="552" font-family="Arial, Helvetica, sans-serif"
        font-size="28" font-weight="400" fill="#5B6470">ai-guide.larosa.work</text>
</svg>
